<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test</title></head>
<body>
<h1>沙箱预览测试</h1>
<p>如果看到这个，iframe 本身正常</p>
<script>
fetch('/api/v1/health')
  .then(r => r.json())
  .then(d => document.body.innerHTML += '<p>API OK: ' + JSON.stringify(d) + '</p>')
  .catch(e => document.body.innerHTML += '<p>API Error: ' + e.message + '</p>');
</script>
</body>
</html>
